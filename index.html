<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Parantez İletişim</title>

  <style>
    body{
      margin:0;
      font-family:Arial;
      background:#0f172a;
      color:white;
      text-align:center;
    }

    .container{
      max-width:1000px;
      margin:auto;
      padding:20px;
    }

    h1{font-size:42px;margin-top:20px}

    .img-box{
      margin-top:25px;
    }

    .img-box img{
      width:100%;
      border-radius:20px;
      box-shadow:0 15px 40px rgba(0,0,0,.5);
    }

    .card{
      background:#111827;
      padding:30px;
      border-radius:20px;
      margin-top:40px;
    }

    .btn{
      display:block;
      margin:15px auto;
      padding:16px;
      width:90%;
      max-width:400px;
      border-radius:14px;
      font-size:18px;
      font-weight:bold;
      text-decoration:none;
    }

    .whatsapp{background:#22c55e;color:#062e16}
    .map{background:#38bdf8;color:#06283d}

    footer{
      margin-top:50px;
      color:#94a3b8;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Parantez İletişim</h1>
  <p>Telefon • Aksesuar • Teknik Servis</p>

  <!-- واجهة المحل -->
  <div class="img-box">
    <img src="shop-front.jpg" alt="Mağaza Önü">
  </div>

  <!-- داخل المحل -->
  <div class="img-box">
    <img src="shop-inside.jpg" alt="Mağaza İçi">
  </div>

  <!-- صورة الفريق -->
  <div class="img-box">
    <img src="shop-team.jpg" alt="Ekip">
  </div>

  <div class="card">
    <h2>Bize Ulaşın</h2>

    <a class="btn whatsapp"
       href="https://wa.me/905557514322"
       target="_blank">
       WhatsApp ile Sipariş
    </a>

    <a class="btn map"
       href="https://maps.app.goo.gl/8hXPKJGbgMKNz2UN9"
       target="_blank">
       Konumu Aç
    </a>
  </div>

  <footer>
    © 2026 Parantez İletişim
  </footer>

</div>

</body>
</html>
